sensenova:
  upstream_url: https://token.sensenova.cn/v1
  auto_refresh: false
  refresh_method: sensenova_api
  api_key: ''
  models:
  # Renamed from local short-id "v4-flash" to match SenseNova's own
  # real model name exactly (confirmed via a real /v1/models response
  # earlier: SenseNova's own catalog calls this "deepseek-v4-flash",
  # not "v4-flash") -- id == upstream_id now, so upstream_id is dropped
  # rather than kept as a redundant duplicate. The previous short-id
  # was gratuitous local renaming with no real benefit and cost a real
  # user a failed request in production: they reasonably guessed the
  # display name would match the model's actual name
  # ("nova/deepseek-v4-flash") and got a 403 because our registry only
  # recognized "nova/v4-flash".
  - id: deepseek-v4-flash
  - id: glm-5.2
  prefix: nova
