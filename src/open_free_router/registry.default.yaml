nous:
  upstream_url: https://inference-api.nousresearch.com/v1
  auto_refresh: false
  refresh_method: nous_api
  api_key: ''
  # Both manual entries previously here (ling-3.0-flash:free ->
  # inclusionai/ling-3.0-flash:free, step-3.7-flash:free ->
  # stepfun/step-3.7-flash:free) were removed 2026-08-02: neither was
  # ever verified against a real, untruncated Nous /v1/models response
  # (a truncated real response was checked earlier and didn't cover
  # either ID either way), and the first was confirmed broken via a
  # real production Hermes session -- Nous's own API returned a live
  # 404 "Model ... not found" for the resolved upstream_id, meaning our
  # proxy correctly routed the request but Nous itself rejected it.
  # Advertising a model as free that 404s on the real upstream is worse
  # than not listing it at all (a clean 403 "not in whitelist" is a much
  # better failure mode for the caller than an accepted-then-rejected
  # round trip). Left empty rather than guess-replaced -- add real
  # verified entries here once a full /v1/models response from a real
  # Nous key is available to check against, same process used to fix
  # stepfun.py/opencode_zen.py's stale entries.
  models: []
  prefix: ns
poolside:
  upstream_url: https://inference.poolside.ai/v1
  auto_refresh: true
  refresh_method: poolside_api
  api_key: ''
  # Local ids renamed 2026-08-02 from laguna-s:free/laguna-xs:free/
  # laguna-m:free to the models' real names. The invented ":free" suffix
  # didn't match anything a user would actually see -- Poolside's own
  # docs (docs.poolside.ai/api/overview, poolside.ai/models) show curl/
  # Python examples using "poolside/laguna-s-2.1" directly against their
  # own API, so a user copying from Poolside's own documentation would
  # never guess ":free". upstream_id (the "poolside/..." prefixed form)
  # was separately confirmed correct via the same official docs -- that
  # part was NOT broken, despite initially looking similar to the SenseNova/
  # Nous issues; only the local display id needed fixing here.
  models:
  - id: laguna-s-2.1
    upstream_id: poolside/laguna-s-2.1
    reasoning: true
  - id: laguna-xs-2.1
    upstream_id: poolside/laguna-xs-2.1
    reasoning: true
  - id: laguna-m.1
    upstream_id: poolside/laguna-m.1
    reasoning: true
  prefix: ps
