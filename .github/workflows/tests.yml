name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        # e2e_test.py is a manual operational smoke-test script (real
        # network calls, expects real agent config files on the machine
        # running it) -- pyproject.toml's addopts already excludes it
        # from plain `pytest`, this is just explicit about why.
        run: pytest -v
